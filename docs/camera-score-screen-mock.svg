<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1400" viewBox="0 0 900 1400">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#12201c" flood-opacity="0.18"/>
    </filter>
    <clipPath id="cameraClip">
      <rect x="80" y="522" width="740" height="740" rx="8"/>
    </clipPath>
  </defs>

  <rect width="900" height="1400" fill="#f5f6f1"/>
  <rect x="40" y="32" width="820" height="1336" rx="28" fill="#ffffff" stroke="#dfe4dd" filter="url(#shadow)"/>

  <text x="80" y="92" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1b221f">麻雀卓点数送信</text>
  <text x="80" y="132" font-family="Arial, sans-serif" font-size="20" fill="#65706b">カメラで点数表示を読み取り、席1〜4へ反映</text>

  <text x="80" y="178" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#65706b">Web API URL</text>
  <rect x="80" y="192" width="740" height="58" rx="8" fill="#ffffff" stroke="#cfd8d2"/>
  <text x="104" y="229" font-family="Arial, sans-serif" font-size="22" fill="#1b221f">http://127.0.0.1:3000</text>

  <text x="80" y="284" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#65706b">端末ID</text>
  <rect x="80" y="298" width="740" height="58" rx="8" fill="#ffffff" stroke="#cfd8d2"/>
  <text x="104" y="335" font-family="Arial, sans-serif" font-size="22" fill="#1b221f">mock-table-1</text>

  <rect x="80" y="386" width="740" height="64" rx="8" fill="#0f766e"/>
  <text x="450" y="426" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">卓情報を取得・更新</text>

  <text x="80" y="494" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1b221f">カメラ読み取り</text>

  <rect x="80" y="522" width="740" height="740" rx="8" fill="#111"/>
  <image href="mahjong-table-camera-sample.png" x="80" y="522" width="740" height="740" preserveAspectRatio="xMidYMid slice" clip-path="url(#cameraClip)"/>
  <rect x="80" y="522" width="740" height="740" rx="8" fill="#000000" opacity="0.08"/>

  <line x1="80" y1="522" x2="820" y2="1262" stroke="#ffffff" stroke-width="4" stroke-dasharray="16 14" opacity="0.9"/>
  <line x1="820" y1="522" x2="80" y2="1262" stroke="#ffffff" stroke-width="4" stroke-dasharray="16 14" opacity="0.9"/>
  <circle cx="450" cy="892" r="10" fill="#ffffff"/>
  <text x="470" y="885" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" stroke="#000000" stroke-width="3" paint-order="stroke">卓中心 / カメラ中心</text>

  <g opacity="0.96">
    <rect x="346" y="522" width="208" height="59" fill="#16803c" fill-opacity="0.18" stroke="#16803c" stroke-width="5"/>
    <text x="360" y="560" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" stroke="#000000" stroke-width="3" paint-order="stroke">席1</text>

    <rect x="761" y="788" width="59" height="208" fill="#0f766e" fill-opacity="0.18" stroke="#0f766e" stroke-width="5"/>
    <text x="770" y="825" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" stroke="#000000" stroke-width="3" paint-order="stroke">席2</text>

    <rect x="346" y="1203" width="208" height="59" fill="#a15c07" fill-opacity="0.2" stroke="#a15c07" stroke-width="5"/>
    <text x="360" y="1240" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" stroke="#000000" stroke-width="3" paint-order="stroke">席3</text>

    <rect x="80" y="788" width="59" height="208" fill="#b42318" fill-opacity="0.18" stroke="#b42318" stroke-width="5"/>
    <text x="89" y="825" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" stroke="#000000" stroke-width="3" paint-order="stroke">席4</text>
  </g>

  <rect x="80" y="1288" width="230" height="56" rx="8" fill="#0f766e"/>
  <text x="195" y="1323" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">カメラ読み取り開始</text>
  <text x="330" y="1311" font-family="Arial, sans-serif" font-size="18" fill="#1b221f">認識結果: 席1 / 席2 / 席3 / 席4 の四角内を読む</text>
  <text x="330" y="1338" font-family="Arial, sans-serif" font-size="18" fill="#65706b">中心線を卓中心に合わせ、赤い点数表示が四角内に入るよう調整</text>
</svg>
